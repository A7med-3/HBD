<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A birthday surprise made with love.">
  <title>Happy Birthday — Her Name</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="confetti-layer" aria-hidden="true"></div>
  <main class="page hero">
    <p class="hero-badge">Since May 14, 2021</p>
    <h1 data-landing-title>Happy 21st Birthday, <span data-her-name>My Love</span></h1>
    <p class="hero-sub" data-landing-sub>Someone made this just for you…</p>
    <p class="typing" data-typing aria-live="polite"></p>
    <div class="counter-box" data-counter aria-label="Time together since we met"></div>
    <button type="button" class="btn" data-enter>Open your surprise</button>
  </main>
  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/index.js"></script>

</html>
